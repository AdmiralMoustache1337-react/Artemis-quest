name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Create local.properties
        run: |
          echo "ndk.dir=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" > local.properties

      - name: Build Quest release APK (nonRoot_game arm64-v8a)
        run: ./gradlew clean :app:assembleNonRoot_gameRelease -Pandroid.injected.build.abi=arm64-v8a

      - name: Sign release APK for sideload installation
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore release-keystore.jks \
            -storepass android \
            -keypass android \
            -alias artemis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Artemis Quest, OU=CI, O=Artemis, L=NA, S=NA, C=US"

          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          rm -rf release-apks
          mkdir -p release-apks

          if [ ! -d app/build/outputs ]; then
            echo "app/build/outputs was not created by Gradle. Build likely failed to generate APK artifacts." >&2
            exit 1
          fi

          mapfile -t release_apks < <(find app/build/outputs -type f -name '*.apk' \
            \( -path '*/release/*' -o -path '*/apk/*' -o -path '*/outputs/*' \) | sort)

          if [ "${#release_apks[@]}" -eq 0 ]; then
            echo "No APK found in app/build/outputs. Available output folders:" >&2
            find app/build/outputs -maxdepth 3 -type d -print >&2 || true
            exit 1
          fi

          signed_any=0
          for apk in "${release_apks[@]}"; do
            base_apk_name="$(basename "$apk")"
            final_apk="release-apks/$base_apk_name"

            if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              echo "Already signed: $apk"
              cp -f "$apk" "$final_apk"
              continue
            fi

            signed_any=1
            signed_apk="$apk"
            target_apk="$final_apk"
            if [[ "$apk" == *-unsigned.apk ]]; then
              signed_apk="${apk%-unsigned.apk}.apk"
              target_apk="release-apks/$(basename "$signed_apk")"
            fi

            "$APKSIGNER" sign \
              --ks release-keystore.jks \
              --ks-key-alias artemis \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$target_apk" \
              "$apk"
            "$APKSIGNER" verify "$target_apk"
          done

          if [ "$signed_any" -eq 0 ]; then
            echo "No unsigned APK found to sign; all APKs were already signed"
          fi

          if ! compgen -G 'release-apks/*.apk' > /dev/null; then
            echo "No release APKs were collected" >&2
            exit 1
          fi

          echo "Final APK artifacts:"
          ls -lh release-apks/*.apk

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: artemis-quest-nonroot-arm64-release
          path: |
            release-apks/*.apk

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/*.apk
